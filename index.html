<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linear System RREF Solver</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React 18 & ReactDOM 18 CDNs -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel Standalone for in-browser JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Custom smooth scroll behavior */
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">
    <!-- Root element for React application -->
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Exact Fractional Math Engine to prevent floating point inaccuracies
        const gcd = (a, b) => {
            a = Math.abs(a);
            b = Math.abs(b);
            return b === 0 ? a : gcd(b, a % b);
        };

        class Frac {
            constructor(n, d = 1) {
                let sign = (n < 0) ^ (d < 0) ? -1 : 1;
                n = Math.abs(n);
                d = Math.abs(d);
                if (d === 0) {
                    this.n = 0;
                    this.d = 0; 
                    return;
                }
                let g = gcd(n, d);
                this.n = sign * (Math.round(n / g));
                this.d = Math.round(d / g);
            }
            
            add(other) { return new Frac(this.n * other.d + other.n * this.d, this.d * other.d); }
            sub(other) { return new Frac(this.n * other.d - other.n * this.d, this.d * other.d); }
            mul(other) { return new Frac(this.n * other.n, this.d * other.d); }
            div(other) { return new Frac(this.n * other.d, this.d * other.n); }
            
            isZero() { return this.n === 0; }
            isOne() { return this.n === 1 && this.d === 1; }
            isNegative() { return this.n < 0; }
            
            toString() {
                if (this.d === 0) return 'NaN';
                if (this.n === 0) return '0';
                if (this.d === 1) return `${this.n}`;
                return `${this.n}/${this.d}`;
            }
        }

        function parseToFrac(str) {
            if (!str || String(str).trim() === '') return new Frac(0, 1);
            str = String(str).trim();
            if (str.includes('/')) {
                const parts = str.split('/');
                if (parts.length !== 2) throw new Error("Invalid fraction format");
                const n = parseFloat(parts[0]);
                const d = parseFloat(parts[1]);
                if (isNaN(n) || isNaN(d) || d === 0) throw new Error("Invalid fraction values");
                return new Frac(n, d);
            }
            const num = parseFloat(str);
            if (isNaN(num)) throw new Error(`Invalid number entry: "${str}"`);
            
            // Convert decimal to fraction (handles up to 4 decimal places)
            const decStr = num.toString();
            if (decStr.includes('.')) {
                const decPlaces = decStr.split('.')[1].length;
                const mult = Math.pow(10, Math.min(decPlaces, 4));
                return new Frac(Math.round(num * mult), mult);
            }
            return new Frac(num, 1);
        }

        function cloneMatrix(matrix) {
            return matrix.map(row => row.map(cell => new Frac(cell.n, cell.d)));
        }

        function generateRREFSteps(inputMatrix) {
            let matrix;
            try {
                matrix = inputMatrix.map(row => row.map(cellStr => parseToFrac(cellStr)));
            } catch (e) {
                throw new Error(e.message);
            }

            let steps = [];
            let rows = matrix.length;
            let cols = matrix[0].length;
            let lead = 0;

            steps.push({
                description: "Initial Augmented Matrix",
                detail: "Starting matrix compiled from your linear system coefficients.",
                matrix: cloneMatrix(matrix),
                highlights: []
            });

            for (let r = 0; r < rows; r++) {
                if (cols <= lead) break;
                
                let i = r;
                while (matrix[i][lead].isZero()) {
                    i++;
                    if (rows === i) {
                        i = r;
                        lead++;
                        if (cols === lead) break;
                    }
                }
                
                if (cols === lead) break;

                // 1. Swap rows if pivot is 0
                if (i !== r) {
                    let temp = matrix[i];
                    matrix[i] = matrix[r];
                    matrix[r] = temp;
                    steps.push({
                        description: `Swap Row ${r + 1} and Row ${i + 1}`,
                        detail: `Obtain a non-zero pivot in column ${lead + 1}.`,
                        matrix: cloneMatrix(matrix),
                        highlights: [r, i]
                    });
                }

                // 2. Normalize pivot row
                let val = matrix[r][lead];
                if (!val.isOne()) {
                    for (let j = 0; j < cols; j++) {
                        matrix[r][j] = matrix[r][j].div(val);
                    }
                    steps.push({
                        description: `Multiply Row ${r + 1} by ${new Frac(val.d, val.n).toString()} (Divide by ${val.toString()})`,
                        detail: `Scale the pivot entry in Row ${r + 1}, Column ${lead + 1} to 1.`,
                        matrix: cloneMatrix(matrix),
                        highlights: [r]
                    });
                }

                // 3. Eliminate non-zeros in other rows of pivot column
                for (let k = 0; k < rows; k++) {
                    if (k !== r) {
                        let val2 = matrix[k][lead];
                        if (!val2.isZero()) {
                            for (let j = 0; j < cols; j++) {
                                let subVal = val2.mul(matrix[r][j]);
                                matrix[k][j] = matrix[k][j].sub(subVal);
                            }
                            
                            let opStr = val2.isNegative() 
                                ? `Add ${new Frac(Math.abs(val2.n), val2.d).toString()} × Row ${r + 1} to Row ${k + 1}`
                                : `Subtract ${val2.toString()} × Row ${r + 1} from Row ${k + 1}`;
                                
                            steps.push({
                                description: opStr,
                                detail: `Eliminate the entry at Row ${k + 1}, Column ${lead + 1} using Row ${r + 1}.`,
                                matrix: cloneMatrix(matrix),
                                highlights: [k]
                            });
                        }
                    }
                }
                lead++;
            }

            let vars = cols - 1;
            let interpretation = { type: 'unique', text: '', details: [] };
            
            // Check for inconsistency (0 = non-zero constant)
            let inconsistent = false;
            for (let r = 0; r < rows; r++) {
                let allZeros = true;
                for (let c = 0; c < vars; c++) {
                    if (!matrix[r][c].isZero()) allZeros = false;
                }
                if (allZeros && !matrix[r][vars].isZero()) {
                    inconsistent = true;
                    interpretation = { 
                        type: 'none', 
                        text: 'No Solution (Inconsistent System)',
                        details: ['The system contains a contradiction.', `Row ${r + 1} evaluates to 0 = ${matrix[r][vars].toString()}`]
                    };
                    break;
                }
            }

            if (!inconsistent) {
                let pivotCols = [];
                let rowForPivot = {};
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < vars; c++) {
                        if (!matrix[r][c].isZero()) {
                            pivotCols.push(c);
                            rowForPivot[c] = r;
                            break;
                        }
                    }
                }

                let freeCols = [];
                for (let c = 0; c < vars; c++) {
                    if (!pivotCols.includes(c)) {
                        freeCols.push(c);
                    }
                }

                const varNames = vars <= 3 ? ['x', 'y', 'z'] : Array.from({length: vars}, (_, i) => `x${i+1}`);

                if (freeCols.length > 0) {
                    const paramNames = ['t', 's', 'r', 'u', 'v', 'w'];
                    let paramMap = {};
                    freeCols.forEach((c, idx) => {
                        paramMap[c] = paramNames[idx % paramNames.length];
                    });

                    let solutionDetails = [];
                    for (let c = 0; c < vars; c++) {
                        if (freeCols.includes(c)) {
                            solutionDetails.push(`${varNames[c]} = ${paramMap[c]}  (free variable)`);
                        } else {
                            let r = rowForPivot[c];
                            let constantTerm = matrix[r][vars];
                            let rhsTerms = [];
                            
                            for (let j = c + 1; j < vars; j++) {
                                let coef = matrix[r][j];
                                if (!coef.isZero()) {
                                    rhsTerms.push({
                                        coef: new Frac(-coef.n, coef.d),
                                        param: paramMap[j]
                                    });
                                }
                            }

                            let rhsString = "";
                            if (constantTerm.isZero() && rhsTerms.length === 0) {
                                rhsString = "0";
                            } else {
                                let components = [];
                                if (!constantTerm.isZero()) {
                                    components.push(constantTerm.toString());
                                }
                                
                                rhsTerms.forEach((term) => {
                                    let isFirst = (components.length === 0);
                                    let sign = term.coef.isNegative() ? "-" : "+";
                                    let absCoef = new Frac(Math.abs(term.coef.n), term.coef.d);
                                    let absStr = absCoef.isOne() ? "" : absCoef.toString();
                                    
                                    if (isFirst) {
                                        components.push((sign === "-" ? "-" : "") + absStr + term.param);
                                    } else {
                                        components.push(`${sign} ${absStr}${term.param}`);
                                    }
                                });
                                rhsString = components.join(" ");
                            }
                            solutionDetails.push(`${varNames[c]} = ${rhsString}`);
                        }
                    }

                    interpretation = { 
                        type: 'infinite', 
                        text: 'Infinitely Many Solutions',
                        details: ['The system is dependent. Expressed in parametric form:', ...solutionDetails]
                    };
                } else {
                    let solutionDetails = [];
                    for (let r = 0; r < vars; r++) {
                        solutionDetails.push(`${varNames[r]} = ${matrix[r][vars].toString()}`);
                    }
                    interpretation = { 
                        type: 'unique', 
                        text: 'Unique Solution Found', 
                        details: solutionDetails 
                    };
                }
            }

            steps[steps.length - 1].interpretation = interpretation;
            return steps;
        }

        function App() {
            const [rows, setRows] = useState(3);
            const [cols, setCols] = useState(4); // 3 vars + 1 constant
            const [matrixInput, setMatrixInput] = useState(
                Array(3).fill().map(() => Array(4).fill('0'))
            );
            const [steps, setSteps] = useState(null);
            const [error, setError] = useState(null);

            useEffect(() => {
                setMatrixInput(prev => {
                    const newMatrix = Array(rows).fill().map(() => Array(cols).fill('0'));
                    for (let r = 0; r < Math.min(rows, prev.length); r++) {
                        for (let c = 0; c < Math.min(cols, prev[r].length); c++) {
                            newMatrix[r][c] = prev[r][c] !== undefined ? prev[r][c] : '0';
                        }
                    }
                    return newMatrix;
                });
                setSteps(null);
                setError(null);
            }, [rows, cols]);

            const handleCellChange = (r, c, val) => {
                const newMatrix = matrixInput.map(row => [...row]);
                newMatrix[r][c] = val;
                setMatrixInput(newMatrix);
                setSteps(null);
                setError(null);
            };

            const resetMatrix = () => {
                setMatrixInput(Array(rows).fill().map(() => Array(cols).fill('0')));
                setSteps(null);
                setError(null);
            };

            const randomizeMatrix = () => {
                setMatrixInput(Array(rows).fill().map(() => 
                    Array(cols).fill().map(() => 
                        String(Math.floor(Math.random() * 21) - 10)
                    )
                ));
                setSteps(null);
                setError(null);
            };

            const handleSolve = () => {
                setError(null);
                try {
                    const generatedSteps = generateRREFSteps(matrixInput);
                    setSteps(generatedSteps);
                    setTimeout(() => {
                        document.getElementById('solution-area')?.scrollIntoView({ behavior: 'smooth' });
                    }, 100);
                } catch (err) {
                    setError(err.message || "Invalid input detected. Ensure entries are integers, decimals, or fractions (e.g., 1/2).");
                }
            };

            const varsCount = cols - 1;
            const varLabels = varsCount <= 3 
                ? ['x', 'y', 'z'].slice(0, varsCount) 
                : Array.from({length: varsCount}, (_, i) => `x${i+1}`);

            return (
                <div className="min-h-screen bg-slate-50 text-slate-800 font-sans pb-20">
                    {/* Header */}
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
                        <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="bg-blue-600 p-2.5 rounded-xl text-white shadow-sm">
                                    <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                                    </svg>
                                </div>
                                <div>
                                    <h1 className="text-xl font-bold text-slate-900 leading-tight">Linear System RREF Solver</h1>
                                    <p className="text-sm text-slate-500 hidden sm:block">Step-by-step Gaussian Elimination with Exact Fractional Arithmetic</p>
                                </div>
                            </div>
                            
                            <a 
                                href="https://pages.github.com" 
                                target="_blank" 
                                rel="noreferrer"
                                className="hidden md:inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors"
                            >
                                <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                                    <path fillRule="evenodd" clipRule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" />
                                </svg>
                                GitHub Pages Ready
                            </a>
                        </div>
                    </header>

                    <main className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
                        
                        {/* Configuration & Matrix Input Card */}
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                            <div className="p-6 sm:p-8 space-y-6">
                                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                                    <div>
                                        <h2 className="text-lg font-semibold text-slate-900 flex items-center gap-2">
                                            <svg className="w-5 h-5 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 10h16M4 14h16M4 18h16" />
                                            </svg>
                                            1. System Dimensions
                                        </h2>
                                        <p className="text-sm text-slate-500 mt-1">Adjust equation count and variable count.</p>
                                    </div>
                                    
                                    <div className="flex items-center gap-4 bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                                        <div className="flex flex-col px-3">
                                            <label className="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Equations (Rows)</label>
                                            <input 
                                                type="number" 
                                                min="2" max="5" 
                                                value={rows} 
                                                onChange={(e) => setRows(Math.max(2, Math.min(5, parseInt(e.target.value) || 2)))}
                                                className="w-16 p-1 text-center bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none font-semibold"
                                            />
                                        </div>
                                        <div className="w-px h-10 bg-slate-200"></div>
                                        <div className="flex flex-col px-3">
                                            <label className="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Variables (Cols)</label>
                                            <input 
                                                type="number" 
                                                min="2" max="6" 
                                                value={cols - 1} 
                                                onChange={(e) => setCols(Math.max(2, Math.min(6, parseInt(e.target.value) || 2)) + 1)}
                                                className="w-16 p-1 text-center bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none font-semibold"
                                            />
                                        </div>
                                    </div>
                                </div>

                                {/* Matrix Grid Input Area */}
                                <div className="bg-slate-50 p-6 rounded-xl border border-slate-200 flex flex-col items-center overflow-x-auto">
                                    <div className="relative inline-flex flex-col items-center justify-center">
                                        {/* Aligned Grid Headers */}
                                        <div 
                                            className="grid gap-x-4 px-4 pb-2 w-full"
                                            style={{ gridTemplateColumns: `repeat(${cols}, minmax(60px, auto))` }}
                                        >
                                            {Array.from({ length: cols }).map((_, c) => {
                                                const isAugmented = c === cols - 1;
                                                return (
                                                    <div key={c} className="relative">
                                                        <div className={`w-16 text-center font-bold text-slate-400 text-sm ${isAugmented ? 'ml-4' : ''}`}>
                                                            {isAugmented ? '=' : varLabels[c]}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>

                                        {/* Augmented Matrix Bracket Grid */}
                                        <div className="relative w-full p-2">
                                            <div className="absolute left-0 top-0 bottom-0 w-3 border-l-4 border-t-4 border-b-4 border-slate-800 rounded-l-xl pointer-events-none"></div>
                                            <div className="absolute right-0 top-0 bottom-0 w-3 border-r-4 border-t-4 border-b-4 border-slate-800 rounded-r-xl pointer-events-none"></div>
                                            
                                            <div 
                                                className="grid gap-x-4 gap-y-3 px-4 py-2"
                                                style={{ gridTemplateColumns: `repeat(${cols}, minmax(60px, auto))` }}
                                            >
                                                {matrixInput.map((row, r) => (
                                                    row.map((cell, c) => {
                                                        const isAugmented = c === cols - 1;
                                                        return (
                                                            <div key={`${r}-${c}`} className="relative">
                                                                {isAugmented && (
                                                                    <div className="absolute left-[-10px] top-[-10px] bottom-[-10px] w-px border-l-2 border-dashed border-slate-300 pointer-events-none"></div>
                                                                )}
                                                                <input
                                                                    type="text"
                                                                    value={cell}
                                                                    onChange={(e) => handleCellChange(r, c, e.target.value)}
                                                                    className={`
                                                                        w-16 text-center p-2 bg-white border border-slate-300 rounded-lg shadow-sm
                                                                        focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none
                                                                        font-semibold text-slate-800 transition-all
                                                                        ${isAugmented ? 'ml-4' : ''}
                                                                    `}
                                                                    placeholder="0"
                                                                />
                                                            </div>
                                                        );
                                                    })
                                                ))}
                                            </div>
                                        </div>
                                    </div>

                                    <p className="mt-6 text-xs text-slate-500 text-center max-w-lg flex items-center justify-center gap-1.5">
                                        <svg className="w-4 h-4 text-slate-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                        </svg>
                                        Enter coefficients as integers, decimals, or fractions (e.g. <code className="bg-slate-200 px-1 rounded text-slate-700">-1/2</code>).
                                    </p>
                                </div>

                                {error && (
                                    <div className="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg flex items-start gap-3">
                                        <svg className="shrink-0 mt-0.5 w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                                        </svg>
                                        <p className="text-sm font-medium">{error}</p>
                                    </div>
                                )}

                                {}
                                <div className="flex items-center justify-end gap-3 pt-4 border-t border-slate-100 flex-wrap">
                                    <button 
                                        onClick={randomizeMatrix}
                                        className="px-4 py-2.5 text-sm font-medium text-slate-600 hover:text-slate-900 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 transition-colors flex items-center gap-2"
                                    >
                                        <svg className="w-4 h-4 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                                        </svg>
                                        Randomize (-10 to 10)
                                    </button>
                                    <button 
                                        onClick={resetMatrix}
                                        className="px-4 py-2.5 text-sm font-medium text-slate-600 hover:text-slate-900 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 transition-colors flex items-center gap-2"
                                    >
                                        <svg className="w-4 h-4 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                        </svg>
                                        Clear
                                    </button>
                                    <button 
                                        onClick={handleSolve}
                                        className="px-6 py-2.5 text-sm font-semibold text-white bg-blue-600 rounded-lg hover:bg-blue-700 shadow-sm hover:shadow transition-all flex items-center gap-2"
                                    >
                                        Solve Step-by-Step
                                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14 5l7 7m0 0l-7 7m7-7H3" />
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </div>

                        {}
                        {/* Results / Steps Timeline Area */}
                        <div id="solution-area">
                            {steps && (
                                <div className="space-y-6">
                                    <h2 className="text-2xl font-bold text-slate-900 flex items-center gap-2 mb-8 pl-2">
                                        <svg className="text-green-500 w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                                        </svg>
                                        Solution & Steps
                                    </h2>

                                    <div className="space-y-8 relative before:absolute before:inset-0 before:ml-6 before:-translate-x-px md:before:mx-auto md:before:translate-x-0 before:h-full before:w-1 before:bg-gradient-to-b before:from-blue-200 before:to-transparent">
                                        {steps.map((step, idx) => {
                                            const isLast = idx === steps.length - 1;
                                            const markerText = idx === 0 ? "Start" : isLast ? "End" : idx;
                                            
                                            return (
                                                <div key={idx} className="relative flex items-center justify-between md:justify-normal md:odd:flex-row-reverse group">
                                                    
                                                    {/* Timeline Node Marker */}
                                                    <div className="flex items-center justify-center w-12 h-12 rounded-full border-4 border-slate-50 bg-blue-100 text-blue-600 font-bold shadow-sm shrink-0 md:order-1 md:group-odd:-translate-x-1/2 md:group-even:translate-x-1/2 z-10 text-xs sm:text-sm">
                                                        {markerText}
                                                    </div>
                                                    
                                                    {/* Step Card Content */}
                                                    <div className="w-[calc(100%-4rem)] md:w-[calc(50%-3rem)] bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 hover:shadow-md transition-shadow">
                                                        <div className="mb-6">
                                                            <h3 className="text-lg font-bold text-slate-900 flex items-center gap-2">
                                                                <svg className="text-blue-500 w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
                                                                </svg>
                                                                {step.description}
                                                            </h3>
                                                            {step.detail && (
                                                                <p className="text-xs text-slate-500 mt-1 pl-7">{step.detail}</p>
                                                            )}
                                                        </div>
                                                        
                                                        {/* Matrix Renderer */}
                                                        <div className="flex justify-center bg-slate-50 py-6 rounded-xl border border-slate-100 overflow-x-auto">
                                                            <div className="relative inline-flex items-center justify-center bg-white p-4 rounded-lg shadow-sm border border-slate-200">
                                                                <div className="absolute left-0 top-0 bottom-0 w-3 border-l-2 border-t-2 border-b-2 border-slate-800 rounded-l-lg pointer-events-none"></div>
                                                                <div className="absolute right-0 top-0 bottom-0 w-3 border-r-2 border-t-2 border-b-2 border-slate-800 rounded-r-lg pointer-events-none"></div>
                                                                
                                                                <div 
                                                                    className="grid gap-x-6 gap-y-3 items-center text-center font-semibold text-slate-700"
                                                                    style={{ gridTemplateColumns: `repeat(${cols}, minmax(40px, auto))` }}
                                                                >
                                                                    {step.matrix.map((row, rIdx) => (
                                                                        row.map((cellObj, cIdx) => {
                                                                            const isAugmented = cIdx === cols - 1;
                                                                            const isHighlighted = step.highlights && step.highlights.includes(rIdx);
                                                                            
                                                                            return (
                                                                                <div 
                                                                                    key={`${rIdx}-${cIdx}`} 
                                                                                    className={`
                                                                                        relative py-1 px-2 rounded-md transition-colors duration-300
                                                                                        ${isHighlighted ? 'bg-blue-100 text-blue-900 font-bold' : ''}
                                                                                        ${isAugmented ? 'pl-6' : ''}
                                                                                    `}
                                                                                >
                                                                                    {isAugmented && (
                                                                                        <div className="absolute left-[-12px] top-[-10px] bottom-[-10px] w-px border-l-2 border-dashed border-slate-300 pointer-events-none"></div>
                                                                                    )}
                                                                                    {cellObj.toString()}
                                                                                </div>
                                                                            );
                                                                        })
                                                                    ))}
                                                                </div>
                                                            </div>
                                                        </div>

                                                        {/* Final Solution Interpretation Block */}
                                                        {step.interpretation && (
                                                            <div className={`mt-6 p-4 rounded-xl border-l-4 ${
                                                                step.interpretation.type === 'unique' ? 'bg-green-50 border-green-500' :
                                                                step.interpretation.type === 'infinite' ? 'bg-amber-50 border-amber-500' :
                                                                'bg-red-50 border-red-500'
                                                            }`}>
                                                                <h4 className={`font-bold text-lg mb-2 ${
                                                                    step.interpretation.type === 'unique' ? 'text-green-800' :
                                                                    step.interpretation.type === 'infinite' ? 'text-amber-800' :
                                                                    'text-red-800'
                                                                }`}>
                                                                    {step.interpretation.text}
                                                                </h4>
                                                                {step.interpretation.details && step.interpretation.details.length > 0 && (
                                                                    <ul className="space-y-1.5 text-slate-700 font-medium text-sm">
                                                                        {step.interpretation.details.map((det, i) => (
                                                                            <li key={i} className="flex items-center gap-2">
                                                                                <div className="w-1.5 h-1.5 rounded-full bg-slate-400 shrink-0"></div>
                                                                                {det}
                                                                            </li>
                                                                        ))}
                                                                    </ul>
                                                                )}
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}
                        </div>

                    </main>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
